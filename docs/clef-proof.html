<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ふよみ ト音記号 骨格検証</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #e9e7e1;
      color: #252a2e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 1360px;
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, rgb(255 255 255 / 82%), transparent 35rem),
        #e9e7e1;
    }

    main {
      width: 1360px;
      margin: 0 auto;
      padding: 16px 20px 18px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      min-height: 52px;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    header p {
      color: #657078;
      font-size: 11px;
      line-height: 1.55;
      letter-spacing: 0.04em;
      text-align: right;
    }

    .comparison {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 500px 340px;
      gap: 16px;
      align-items: stretch;
    }

    .card,
    .marker-card {
      overflow: hidden;
      border: 1px solid rgb(37 42 46 / 13%);
      border-radius: 15px;
      background: #fbfaf7;
      box-shadow: 0 6px 24px rgb(35 39 42 / 6%);
    }

    .card {
      min-height: 500px;
      padding: 13px 14px 14px;
    }

    .card-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      min-height: 39px;
    }

    h2 {
      font-size: 14px;
      line-height: 1.4;
      font-weight: 680;
    }

    .measure {
      color: #6b757c;
      font: 600 10px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }

    .hero-stage {
      display: grid;
      place-items: center;
      height: 440px;
      border-radius: 11px;
      background:
        linear-gradient(rgb(37 42 46 / 4%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(37 42 46 / 4%) 1px, transparent 1px),
        #fff;
      background-size: 22px 22px;
    }

    .hero-stage svg {
      display: block;
      width: 100%;
      height: 440px;
    }

    .actual-stage {
      display: grid;
      place-items: center;
      min-height: 400px;
      border-radius: 11px;
      background: #fff;
    }

    .staff-12 {
      width: 456px;
    }

    .staff-8 {
      width: 304px;
    }

    .staff-12 svg,
    .staff-8 svg {
      display: block;
      width: 100%;
    }

    .ruler {
      display: flex;
      justify-content: center;
      gap: 16px;
      min-height: 26px;
      padding-top: 9px;
      color: #667179;
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: 0.025em;
    }

    .ruler span::before {
      content: "";
      display: inline-block;
      width: 16px;
      margin-right: 5px;
      border-top: 1px solid #7a858c;
      vertical-align: 3px;
    }

    .marker-card {
      display: grid;
      grid-template-columns: 720px 1fr;
      gap: 22px;
      min-height: 228px;
      margin-top: 14px;
      padding: 12px 18px;
    }

    .marker-stage {
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #fff;
    }

    .marker-stage svg {
      display: block;
      width: 700px;
      height: 204px;
    }

    .marker-copy {
      align-self: center;
      padding-right: 10px;
    }

    .marker-copy h2 {
      margin-bottom: 10px;
    }

    .marker-copy p {
      color: #5f6a71;
      font-size: 11px;
      line-height: 1.8;
    }

    .marker-copy strong {
      color: #252a2e;
      font-weight: 680;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Treble clef skeleton proof</h1>
      <p>G4線を y=0 とする一本の stroked path<br>尾・交差・渦中心を五線間隔座標で確認</p>
    </header>

    <section class="comparison" aria-label="ト音記号の3つの表示寸法">
      <article class="card">
        <div class="card-heading">
          <h2>a　記号単体</h2>
          <span class="measure">骨格高 400px 以上</span>
        </div>
        <div class="hero-stage">
          <svg viewBox="-1.8 -4.9 3.6 8.8" role="img" aria-label="大きく表示したト音記号">
            <path data-clef-path fill="none" stroke="#252a2e" stroke-width="0.40"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </article>

      <article class="card">
        <div class="card-heading">
          <h2>b　五線上の実寸相当</h2>
          <span class="measure">staff-space = 12px</span>
        </div>
        <div class="actual-stage">
          <div id="staff-12" class="staff-12"></div>
        </div>
        <div class="ruler"><span>線間 12px</span><span>線幅 4.8px</span></div>
      </article>

      <article class="card">
        <div class="card-heading">
          <h2>c　iPhone実寸</h2>
          <span class="measure">staff-space = 8px</span>
        </div>
        <div class="actual-stage">
          <div id="staff-8" class="staff-8"></div>
        </div>
        <div class="ruler"><span>線間 8px</span><span>線幅 3.2px</span></div>
      </article>
    </section>

    <section class="marker-card" aria-label="骨格の基準点">
      <div class="marker-stage">
        <svg viewBox="-1.9 -4.85 7.1 8.9" role="img" aria-label="五線と骨格の3つの基準点">
          <g fill="none" stroke="#9aa4aa" stroke-width="0.055" stroke-linecap="round">
            <path d="M -1.55 1 H 4.75"/>
            <path d="M -1.55 0 H 4.75"/>
            <path d="M -1.55 -1 H 4.75"/>
            <path d="M -1.55 -2 H 4.75"/>
            <path d="M -1.55 -3 H 4.75"/>
          </g>
          <path data-clef-path fill="none" stroke="#252a2e" stroke-width="0.40"
            stroke-linecap="round" stroke-linejoin="round"/>

          <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="0.34">
            <g fill="#bf725f" stroke="#bf725f">
              <circle cx="-0.34" cy="3.40" r="0.13" fill="#fff" stroke-width="0.07"/>
              <path d="M -0.18 3.34 L 1.62 2.92" fill="none" stroke-width="0.055"/>
              <text x="1.76" y="3.02" stroke="none">尾の終端　y = −3.4</text>
            </g>
            <g fill="#6d8e9f" stroke="#6d8e9f">
              <circle cx="0.10" cy="-1.00" r="0.13" fill="#fff" stroke-width="0.07"/>
              <path d="M 0.25 -1.04 L 1.62 -1.62" fill="none" stroke-width="0.055"/>
              <text x="1.76" y="-1.52" stroke="none">交差点　y = +1.0</text>
            </g>
            <g fill="#718d67" stroke="#718d67">
              <circle cx="0" cy="0" r="0.13" fill="#fff" stroke-width="0.07"/>
              <path d="M 0.16 0.04 L 1.62 0.62" fill="none" stroke-width="0.055"/>
              <text x="1.76" y="0.72" stroke="none">渦の中心　y = 0</text>
            </g>
          </g>
        </svg>
      </div>
      <div class="marker-copy">
        <h2>骨格の読みどころ</h2>
        <p><strong>赤</strong>は最下線より2.4線間下へ出る尾。<br>
          <strong>青</strong>は上の張り出しから降りた弧と縦の流れの交差。<br>
          <strong>緑</strong>は下から2番目の線、G4に置いた渦の中心。</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { CLEF_PATH, renderStaff } from '../js/staff.js';

    for (const path of document.querySelectorAll('[data-clef-path]')) {
      path.setAttribute('d', CLEF_PATH);
    }

    document.querySelector('#staff-12').insertAdjacentHTML('beforeend', renderStaff({
      key: 'C',
      notes: [],
      width: 456,
      theme: 'light',
    }));
    document.querySelector('#staff-8').insertAdjacentHTML('beforeend', renderStaff({
      key: 'C',
      notes: [],
      width: 304,
      theme: 'light',
    }));
    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
